<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Library ASBA workspace — circulation, catalogue, membership and reports.">
<meta name="color-scheme" content="light">
<title>Library ASBA</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f3ba2'/%3E%3Cpath d='M16 10.5c-1.7-1.4-4.2-2-7.2-2v11.6c3 0 5.5.6 7.2 2 1.7-1.4 4.2-2 7.2-2V8.5c-3 0-5.5.6-7.2 2z' fill='none' stroke='%23fff' stroke-width='1.8' stroke-linejoin='round'/%3E%3Cpath d='M16 10.5v11.6' stroke='%23fff' stroke-width='1.8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="app">

<a class="skip-link" href="#content">Skip to main content</a>

<header class="topbar">
  <div class="topbar__left">
    <button type="button" class="icon-button topbar__menu" data-action="toggle-nav"
            aria-label="Toggle navigation" aria-expanded="false" aria-controls="sidebar">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
        <path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/>
      </svg>
    </button>

    <a class="brand" href="#/home">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 6.4C10.2 4.9 7.6 4.3 4.5 4.3v12.4c3.1 0 5.7.6 7.5 2.1 1.8-1.5 4.4-2.1 7.5-2.1V4.3c-3.1 0-5.7.6-7.5 2.1z"/>
          <path d="M12 6.4v12.4"/>
        </svg>
      </span>
      <span class="brand__name">Library ASBA</span>
    </a>
  </div>

  <div class="topbar__right">
    <button type="button" class="account" data-action="go" data-page="profile">
      <span class="account__avatar" id="accountAvatar" aria-hidden="true">A</span>
      <span class="account__text">
        <strong id="accountName">User</strong>
        <small id="accountRole">Role</small>
      </span>
    </button>
    <button type="button" class="btn btn--ghost btn--small" data-action="logout">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M14 5.5H6.5A1.5 1.5 0 0 0 5 7v10a1.5 1.5 0 0 0 1.5 1.5H14"/><path d="M17 8.5 20.5 12 17 15.5"/><path d="M20 12h-9.5"/>
      </svg>
      Sign out
    </button>
  </div>
</header>

<div class="workspace">
  <nav class="sidebar" id="sidebar" aria-labelledby="sidebarLabel"></nav>
  <div class="workspace__scrim" data-action="toggle-nav" aria-hidden="true"></div>

  <main class="main" id="content" tabindex="-1"></main>
</div>

<footer class="site-footer">
  <p>Library ASBA · Library Management System · Built with HTML, CSS and vanilla JavaScript</p>
</footer>

<dialog id="appModal" class="dialog" aria-labelledby="appModalTitle">
  <div class="dialog__head">
    <div>
      <h2 id="appModalTitle"></h2>
      <p id="appModalDescription" class="dialog__description" hidden></p>
    </div>
    <button type="button" class="icon-button" data-action="close-modal" aria-label="Close dialog">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
        <path d="M6.5 6.5l11 11"/><path d="M17.5 6.5l-11 11"/>
      </svg>
    </button>
  </div>
  <div id="appModalBody" class="dialog__body"></div>
</dialog>

<dialog id="confirmModal" class="dialog dialog--confirm" aria-labelledby="confirmModalTitle">
  <div class="dialog__body">
    <h2 id="confirmModalTitle"></h2>
    <p id="confirmModalMessage" class="dialog__message"></p>
    <div class="form-actions">
      <button type="button" class="btn btn--ghost" id="confirmModalCancel"
              data-action="close-confirm">Cancel</button>
      <button type="button" class="btn btn--primary" id="confirmModalAccept">Confirm</button>
    </div>
  </div>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="js/core.js"></script>
<script src="js/ui.js"></script>
<script src="js/pages.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
